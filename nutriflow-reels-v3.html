<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriFlow Reels V3 - Manifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #0A0A0F;
--text: #F4F1EC;
--green: #22C55E;
--blue: #3B82F6;
--leaf: #BCE396;
--arrow: #8FD3F4;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
body { display: flex; align-items: center; justify-content: center; cursor: none; }
body.paused { cursor: default; }

#stage {
position: relative;
width: 1080px;
height: 1920px;
background: var(--bg);
transform-origin: center center;
overflow: hidden;
}

/* Background: Chaos to Order Grid */
.grid-chaos {
position: absolute; inset: 0; z-index: 0; opacity: 0.1;
background-image:
linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
background-size: 40px 40px;
transform: perspective(1000px) rotateX(60deg) scale(2);
transform-origin: center bottom;
will-change: transform, opacity;
}

.glow-spot {
position: absolute; border-radius: 50%; filter: blur(150px); opacity: 0.3; z-index: 1;
mix-blend-mode: screen; pointer-events: none; will-change: transform;
}
.spot-1 { width: 800px; height: 800px; background: var(--green); top: -20%; left: -20%; }
.spot-2 { width: 600px; height: 600px; background: var(--blue); bottom: -10%; right: -10%; }

/* Content */
#content {
position: absolute; inset: 0; z-index: 10;
display: flex; flex-direction: column; align-items: center; justify-content: center;
perspective: 1200px;
}

.scene {
position: absolute; inset: 0;
display: flex; flex-direction: column; align-items: center; justify-content: center;
padding: 280px 70px 670px 70px;
opacity: 0; visibility: hidden;
transform-style: preserve-3d;
}

/* Typography - Manifesto Style */
.manifesto-text {
font-family: 'Space Grotesk', sans-serif;
font-weight: 700;
color: var(--text);
text-align: center;
line-height: 1.05;
letter-spacing: -0.04em;
text-transform: uppercase;
}

.word-glitch {
display: inline-block;
opacity: 0;
transform: translateX(-50px) skewX(-10deg);
filter: blur(10px);
will-change: transform, opacity, filter;
margin: 0 5px;
}

.highlight-green { color: var(--green); text-shadow: 0 0 30px rgba(34, 197, 94, 0.6); }
.highlight-blue { color: var(--blue); text-shadow: 0 0 30px rgba(59, 130, 246, 0.6); }

/* Visual Metaphors */
.chaos-particles { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.c-particle {
position: absolute; background: rgba(255,255,255,0.2); border-radius: 2px;
will-change: transform, opacity;
}

.order-line {
position: absolute; height: 4px; background: var(--green); border-radius: 2px;
box-shadow: 0 0 20px var(--green);
opacity: 0; transform: scaleX(0); transform-origin: left;
will-change: transform, opacity;
}

.logo-reveal {
width: 400px; height: 400px; position: relative;
opacity: 0; transform: scale(0.5);
will-change: transform, opacity;
}

.logo-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 50px rgba(34, 197, 94, 0.5)); }

.stat-big {
font-family: 'Space Grotesk'; font-size: 200px; font-weight: 700; line-height: 1;
opacity: 0; transform: translateY(100px);
will-change: transform, opacity;
}

.cta-final {
font-family: 'Space Grotesk'; font-size: 180px; font-weight: 700; color: var(--green);
text-shadow: 0 0 60px rgba(34, 197, 94, 0.8);
opacity: 0; transform: scale(0.5);
letter-spacing: -5px;
}

.url-final {
font-family: 'Space Grotesk'; font-size: 56px; color: var(--text); margin-top: 30px;
opacity: 0; letter-spacing: 4px; text-transform: uppercase;
}
.url-final span { color: var(--green); }

/* Overlays */
#start-screen, #countdown-screen {
position: absolute; inset: 0; z-index: 100; background: var(--bg);
display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#start-screen h1 { font-family: 'Space Grotesk'; font-size: 80px; color: var(--text); margin-top: 40px; text-transform: uppercase; letter-spacing: -2px; }
#start-screen p { font-size: 28px; color: rgba(244, 241, 236, 0.5); margin-top: 20px; animation: blink 1.5s infinite; }
#countdown-screen { display: none; }
#cd-num { font-family: 'Space Grotesk'; font-size: 500px; font-weight: 700; color: var(--green); opacity: 0; transform: scale(0.5); }
#flash { position: absolute; inset: 0; z-index: 50; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: difference; }
#debug { position: absolute; top: 20px; right: 20px; z-index: 200; color: var(--green); font-family: monospace; font-size: 24px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; display: none; }

@keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body class="paused">
<div id="stage">
<div class="grid-chaos" id="grid"></div>
<div class="glow-spot spot-1" id="spot1"></div>
<div class="glow-spot spot-2" id="spot2"></div>
<div class="chaos-particles" id="particles"></div>
<div id="flash"></div>

<div id="start-screen">
<svg width="150" height="150" viewBox="0 0 100 100" fill="none">
<path d="M50 15 C50 15 75 45 65 70 C60 80 50 85 50 85 C50 85 40 80 35 70 C25 45 50 15 50 15Z" fill="#BCE396"/>
<path d="M25 45 C25 45 45 55 45 75 C45 85 35 85 35 85 C35 85 15 75 25 45Z" fill="#BCE396"/>
<path d="M20 75 C45 95 85 85 85 50 C85 40 80 30 75 25" stroke="#8FD3F4" stroke-width="9" stroke-linecap="round" fill="none"/>
<path d="M68 32 L78 22 L85 32" stroke="#8FD3F4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
<h1>NutriFlow</h1>
<p>Clique ou ESPAÇO para começar</p>
</div>

<div id="countdown-screen"><div id="cd-num">3</div></div>

<div id="content">
<!-- Scene 1: The Pain (Chaos) -->
<div class="scene" id="scene1">
<div class="manifesto-text" style="font-size: 100px;" id="s1-text"></div>
</div>

<!-- Scene 2: The Turning Point -->
<div class="scene" id="scene2">
<div class="manifesto-text" style="font-size: 120px;" id="s2-text"></div>
<div class="order-line" id="line1" style="top: 45%; left: 10%; width: 80%;"></div>
<div class="order-line" id="line2" style="top: 55%; left: 10%; width: 80%; background: var(--blue); box-shadow: 0 0 20px var(--blue);"></div>
</div>

<!-- Scene 3: The Solution (Logo Reveal) -->
<div class="scene" id="scene3">
<div class="logo-reveal" id="s3-logo">
<svg class="logo-svg" viewBox="0 0 100 100" fill="none">
<path d="M50 15 C50 15 75 45 65 70 C60 80 50 85 50 85 C50 85 40 80 35 70 C25 45 50 15 50 15Z" fill="#BCE396"/>
<path d="M25 45 C25 45 45 55 45 75 C45 85 35 85 35 85 C35 85 15 75 25 45Z" fill="#BCE396"/>
<path d="M50 85 Q45 65 50 45" stroke="#0A0A0F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path d="M35 85 Q35 70 40 60" stroke="#0A0A0F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path d="M20 75 C45 95 85 85 85 50 C85 40 80 30 75 25" stroke="#8FD3F4" stroke-width="9" stroke-linecap="round" fill="none"/>
<path d="M68 32 L78 22 L85 32" stroke="#8FD3F4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
</div>
<div class="manifesto-text" style="font-size: 80px; margin-top: 40px;" id="s3-text"></div>
</div>

<!-- Scene 4: The Proof (Stats) -->
<div class="scene" id="scene4">
<div class="stat-big highlight-green" id="stat1">10x</div>
<div class="manifesto-text" style="font-size: 60px; margin-top: 20px; opacity: 0.8;" id="s4-text"></div>
</div>

<!-- Scene 5: The Vision -->
<div class="scene" id="scene5">
<div class="manifesto-text" style="font-size: 90px;" id="s5-text"></div>
</div>

<!-- Scene 6: The Call -->
<div class="scene" id="scene6">
<div class="cta-final" id="s6-cta">COMECE</div>
<div class="url-final" id="s6-url">nutriflow<span>.</span>inf<span>.</span>br</div>
</div>
</div>
<div id="debug">0.00s</div>
</div>

<script>
(function() {
'use strict';

// --- NEW SCRIPT: Manifesto Style ---
const SCENES = [
{ id: 1, start: 0, end: 4, text: "Chega de planilhas infinitas", highlight: ["Chega", "infinitas"] },
{ id: 2, start: 4.5, end: 9, text: "Chega de perder noites organizando dietas", highlight: ["Chega", "noites"] },
{ id: 3, start: 9.5, end: 15, text: "Existe um jeito melhor", highlight: ["melhor"] },
{ id: 4, start: 15.5, end: 21, text: "Mais rápido. Mais inteligente.", highlight: ["rápido", "inteligente"] },
{ id: 5, start: 21.5, end: 27, text: "Seu tempo vale ouro. Invista nele.", highlight: ["tempo", "ouro"] },
{ id: 6, start: 27.5, end: 35, text: "", highlight: [] }
];

const TOTAL_DURATION = 35.0;
let state = 'idle', startTime = 0, pauseTime = 0, elapsed = 0, cdStart = 0, rafId = null, showDebug = false;

const stage = document.getElementById('stage');
const startScreen = document.getElementById('start-screen');
const cdScreen = document.getElementById('countdown-screen');
const cdNum = document.getElementById('cd-num');
const flash = document.getElementById('flash');
const debug = document.getElementById('debug');
const grid = document.getElementById('grid');
const spot1 = document.getElementById('spot1');
const spot2 = document.getElementById('spot2');
const particlesContainer = document.getElementById('particles');

// Easing
const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeOutBack = (t) => { const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v) => Math.max(0, Math.min(1, v));

// Init Particles (Chaos)
const particles = [];
for(let i=0; i<60; i++) {
const p = document.createElement('div');
p.className = 'c-particle';
const w = Math.random() * 20 + 5;
const h = Math.random() * 4 + 1;
p.style.width = w + 'px';
p.style.height = h + 'px';
p.style.left = Math.random() * 100 + '%';
p.style.top = Math.random() * 100 + '%';
particlesContainer.appendChild(p);
particles.push({ el: p, x: Math.random() * 1080, y: Math.random() * 1920, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, rot: Math.random() * 360 });
}

// Build Text
SCENES.forEach(sc => {
if (!sc.text) return;
const container = document.getElementById(`s${sc.id}-text`);
if (!container) return;
container.innerHTML = '';
const words = sc.text.split(' ');
const duration = sc.end - sc.start;
const wordDur = duration / (words.length + 1);
words.forEach((w, i) => {
const span = document.createElement('span');
span.className = 'word-glitch';
const clean = w.replace(/[^a-zA-ZÀ-ɏ0-9]/g, '');
if (sc.highlight.includes(clean)) span.classList.add('highlight-green');
span.textContent = w + ' ';
span.dataset.delay = (i * wordDur).toFixed(3);
span.dataset.dur = '0.5';
container.appendChild(span);
});
});

function fitStage() {
const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

function render(t) {
// Global Zoom
const zoom = 1 + (t * 0.003);
document.getElementById('content').style.transform = `scale(${zoom})`;

// Background Evolution: Chaos -> Order
// Grid straightens out over time
const gridRot = lerp(60, 0, clamp(t / 15)); // Straightens by 15s
const gridScale = lerp(2, 1, clamp(t / 15));
grid.style.transform = `perspective(1000px) rotateX(${gridRot}deg) scale(${gridScale})`;
grid.style.opacity = lerp(0.1, 0.05, clamp(t / 15));

// Spots move
const bt = t * 0.3;
spot1.style.transform = `translate(${Math.sin(bt)*100}px, ${Math.cos(bt*0.8)*100}px)`;
spot2.style.transform = `translate(${Math.cos(bt*0.6)*80}px, ${Math.sin(bt*0.9)*60}px)`;

// Particles: Chaos -> Order
// They slow down and align as time progresses
const orderFactor = clamp(t / 12); // 0 = chaos, 1 = order
particles.forEach(p => {
if (orderFactor < 0.8) {
// Chaos movement
p.x += p.vx * (1 - orderFactor);
p.y += p.vy * (1 - orderFactor);
p.rot += 5 * (1 - orderFactor);
// Bounce
if (p.x < 0 || p.x > 1080) p.vx *= -1;
if (p.y < 0 || p.y > 1920) p.vy *= -1;
} else {
// Align to grid (invisible force)
const targetX = Math.round(p.x / 100) * 100;
const targetY = Math.round(p.y / 100) * 100;
p.x = lerp(p.x, targetX, 0.1);
p.y = lerp(p.y, targetY, 0.1);
p.rot = lerp(p.rot, 0, 0.1);
}
p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg)`;
p.el.style.opacity = 0.3 + Math.sin(t + p.x) * 0.2;
});

// Scene Logic
let activeIdx = -1;
SCENES.forEach((sc, i) => { if (t >= sc.start && t <= sc.end) activeIdx = i; });

SCENES.forEach((sc, i) => {
const el = document.getElementById(`scene${sc.id}`);
const localT = t - sc.start;

if (i === activeIdx) {
el.style.visibility = 'visible';
const progress = clamp(localT / 0.4);
const ease = easeOutExpo(progress);
el.style.opacity = ease;
el.style.transform = `scale(${lerp(0.95, 1, ease)})`;

// Words (Glitch entry)
const words = el.querySelectorAll('.word-glitch');
words.forEach(w => {
const delay = parseFloat(w.dataset.delay);
const wdur = parseFloat(w.dataset.dur);
const wp = clamp((localT - delay) / wdur);
const we = easeOutExpo(wp);
w.style.opacity = clamp(we);
w.style.transform = `translateX(${lerp(-50, 0, we)}px) skewX(${lerp(-10, 0, we)}deg)`;
w.style.filter = `blur(${lerp(10, 0, we)}px)`;
});

renderVisuals(sc.id, localT);
} else if (t > sc.end && t < sc.end + 0.4) {
const exitP = clamp((t - sc.end) / 0.4);
el.style.opacity = 1 - easeOutExpo(exitP);
el.style.transform = `scale(${lerp(1, 1.05, exitP)})`;
} else {
el.style.opacity = 0;
el.style.visibility = 'hidden';
}
});

// Flash
let flashOpacity = 0;
SCENES.forEach(sc => {
const diff = Math.abs(t - sc.start);
if (diff < 0.1) flashOpacity = Math.max(flashOpacity, (1 - diff/0.1) * 0.4);
});
flash.style.opacity = flashOpacity;

if (showDebug) debug.textContent = t.toFixed(2) + 's';
}

function renderVisuals(id, lt) {
if (id === 2) {
// Lines drawing in
const l1 = document.getElementById('line1');
const l2 = document.getElementById('line2');
const p1 = clamp((lt - 0.5) / 0.8);
const p2 = clamp((lt - 0.7) / 0.8);
l1.style.opacity = clamp(easeOutExpo(p1));
l1.style.transform = `scaleX(${easeOutExpo(p1)})`;
l2.style.opacity = clamp(easeOutExpo(p2));
l2.style.transform = `scaleX(${easeOutExpo(p2)})`;
}
if (id === 3) {
// Logo Reveal
const logo = document.getElementById('s3-logo');
const p = clamp(lt / 1.0);
const e = easeOutBack(p);
logo.style.opacity = clamp(e);
logo.style.transform = `scale(${lerp(0.5, 1, e)}) rotate(${lerp(-180, 0, e)}deg)`;
}
if (id === 4) {
// Stat Counter
const stat = document.getElementById('stat1');
const p = clamp(lt / 0.8);
const e = easeOutBack(p);
stat.style.opacity = clamp(e);
stat.style.transform = `translateY(${lerp(100, 0, e)}px)`;
// Animate number if needed (static 10x for now)
}
if (id === 6) {
const cta = document.getElementById('s6-cta');
const url = document.getElementById('s6-url');
const p1 = clamp(lt / 0.8);
const e1 = easeOutBack(p1);
cta.style.opacity = clamp(e1);
cta.style.transform = `scale(${lerp(0.5, 1, e1)})`;
const p2 = clamp((lt - 1) / 0.6);
const e2 = easeOutExpo(p2);
url.style.opacity = clamp(e2);
}
}

function renderCountdown(num, frac) {
cdNum.textContent = num;
const e = easeOutBack(clamp(frac / 0.5));
cdNum.style.opacity = clamp(e);
cdNum.style.transform = `scale(${lerp(0.5, 1, e)})`;
if (frac > 0.8) cdNum.style.opacity = 1 - clamp((frac - 0.8) / 0.2);
}

function tick(now) {
if (state === 'countdown') {
const cdElapsed = (now - cdStart) / 1000;
const num = 3 - Math.floor(cdElapsed);
const frac = cdElapsed % 1;
if (num <= 0) {
state = 'playing';
cdScreen.style.display = 'none';
startTime = now;
elapsed = 0;
rafId = requestAnimationFrame(tick);
return;
}
renderCountdown(num, frac);
rafId = requestAnimationFrame(tick);
return;
}
if (state === 'playing') {
elapsed = (now - startTime) / 1000;
if (elapsed >= TOTAL_DURATION) {
elapsed = TOTAL_DURATION;
state = 'ended';
render(elapsed);
document.body.classList.add('paused');
return;
}
render(elapsed);
rafId = requestAnimationFrame(tick);
return;
}
}

function start() {
state = 'countdown';
startScreen.style.display = 'none';
cdScreen.style.display = 'flex';
cdStart = performance.now();
document.body.classList.remove('paused');
rafId = requestAnimationFrame(tick);
}

function togglePause() {
if (state === 'idle') { start(); return; }
if (state === 'ended') return;
if (state === 'playing') {
state = 'paused';
pauseTime = performance.now();
cancelAnimationFrame(rafId);
document.body.classList.add('paused');
} else if (state === 'paused') {
const pausedDuration = performance.now() - pauseTime;
startTime += pausedDuration;
state = 'playing';
document.body.classList.remove('paused');
rafId = requestAnimationFrame(tick);
}
}

function restart() {
cancelAnimationFrame(rafId);
state = 'idle';
elapsed = 0;
startScreen.style.display = 'flex';
cdScreen.style.display = 'none';
document.body.classList.add('paused');
render(0);
}

function jump(dir) {
if (state !== 'playing' && state !== 'paused') return;
let current = -1;
SCENES.forEach((sc, i) => { if (elapsed >= sc.start && elapsed <= sc.end) current = i; });
let target = current + dir;
if (target < 0) target = 0;
if (target >= SCENES.length) target = SCENES.length - 1;
elapsed = SCENES[target].start + 0.01;
startTime = performance.now() - (elapsed * 1000);
if (state === 'paused') render(elapsed);
}

document.addEventListener('keydown', (e) => {
if (e.code === 'Space') { e.preventDefault(); togglePause(); }
if (e.code === 'KeyR') restart();
if (e.code === 'ArrowRight') jump(1);
if (e.code === 'ArrowLeft') jump(-1);
if (e.code === 'KeyT') { showDebug = !showDebug; debug.style.display = showDebug ? 'block' : 'none'; }
});

document.addEventListener('click', () => { if (state === 'idle') start(); });

render(0);
})();
</script>
</body>
</html>
