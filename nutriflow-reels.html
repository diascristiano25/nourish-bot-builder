<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriFlow - Reels Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Inter',sans-serif}
body{display:flex;align-items:center;justify-content:center;cursor:none}
body.paused{cursor:default}
#stage-wrapper{position:relative;width:1080px;height:1920px;transform-origin:center center;background:#0A0A0F;overflow:hidden}
.bg-blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.18;will-change:transform}
.bg-blob.green{width:600px;height:600px;background:#22C55E;top:200px;left:-100px}
.bg-blob.blue{width:500px;height:500px;background:#3B82F6;bottom:300px;right:-80px}
.bg-blob.accent{width:400px;height:400px;background:#22C55E;top:900px;right:100px;opacity:.10}
.grain{position:absolute;inset:0;z-index:1;opacity:.12;pointer-events:none;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%)}
#content{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;will-change:transform,opacity,filter;padding:280px 70px 670px 70px}
.title{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#F4F1EC;text-align:center;line-height:1.35;letter-spacing:-.02em}
.highlight{color:#22C55E}
.word{display:inline-block;opacity:0;transform:translateY(30px);filter:blur(8px);will-change:transform,opacity,filter;margin:0 10px}
/* Logo Styles */
.logo-container{width:240px;height:240px;margin-bottom:40px;opacity:0;transform:scale(.8);will-change:transform,opacity;display:flex;align-items:center;justify-content:center}
.logo-svg{width:100%;height:100%;filter:drop-shadow(0 0 20px rgba(34,197,94,0.3))}
.app-mockup{width:800px;height:500px;margin-top:50px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;opacity:0;transform:translateY(40px) scale(.95);will-change:transform,opacity;position:relative;overflow:hidden}
.app-header{height:50px;background:rgba(34,197,94,.15);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 20px;gap:8px}
.app-dot{width:10px;height:10px;border-radius:50%}
.app-body{padding:20px;display:flex;gap:15px}
.app-sidebar{width:180px;display:flex;flex-direction:column;gap:10px}
.app-sbar-item{height:30px;border-radius:8px;background:rgba(255,255,255,.06)}
.app-main{flex:1;display:flex;flex-direction:column;gap:12px}
.app-card{height:80px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.feature-cards{display:flex;gap:20px;margin-top:50px;width:100%;opacity:0;transform:translateY(40px);will-change:transform,opacity}
.feat-card{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:36px 24px;display:flex;flex-direction:column;align-items:center;gap:15px;text-align:center}
.feat-icon{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.feat-label{font-family:'Inter',sans-serif;font-size:28px;color:#F4F1EC;font-weight:500}
.comparison{display:flex;gap:30px;margin-top:50px;width:100%;opacity:0;transform:translateY(40px);will-change:transform,opacity}
.comp-panel{flex:1;border-radius:16px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;gap:15px}
.comp-before{background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.15)}
.comp-after{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15)}
.comp-label{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600}
.comp-value{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700}
.care-icons{display:flex;gap:40px;margin-top:50px;opacity:0;transform:translateY(40px);will-change:transform,opacity}
.care-icon-wrap{display:flex;flex-direction:column;align-items:center;gap:15px}
.care-circle{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.care-label{font-family:'Inter',sans-serif;font-size:26px;color:#F4F1EC;font-weight:500}
.cta-word{font-family:'Space Grotesk',sans-serif;font-size:160px;font-weight:700;color:#22C55E;text-align:center;position:relative;opacity:0;transform:scale(.8);will-change:transform,opacity}
.cta-shine{position:absolute;inset:-20px;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.25) 48%,rgba(255,255,255,.4) 50%,rgba(255,255,255,.25) 52%,transparent 70%);background-size:300% 100%;pointer-events:none;mix-blend-mode:soft-light;border-radius:20px;opacity:0;will-change:background-position,opacity}
.site-url{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:600;color:#F4F1EC;margin-top:40px;opacity:0;transform:translateY(20px);will-change:transform,opacity;letter-spacing:-.01em}
.site-url .dot{color:#22C55E}
#start-overlay{position:absolute;inset:0;z-index:100;background:#0A0A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
#start-overlay h1{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700;color:#F4F1EC;text-align:center}
#start-overlay p{font-family:'Inter',sans-serif;font-size:36px;color:#F4F1EC;opacity:.6;text-align:center}
.start-logo{width:180px;height:180px;margin-bottom:20px;opacity:0.9}
.pulse-ring{width:120px;height:120px;border-radius:50%;border:3px solid #22C55E;opacity:0;animation:pulseRing 2s ease-out infinite;position:absolute}
@keyframes pulseRing{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.6);opacity:0}}
#countdown{position:absolute;inset:0;z-index:90;background:#0A0A0F;display:none;align-items:center;justify-content:center}
#countdown-num{font-family:'Space Grotesk',sans-serif;font-size:300px;font-weight:700;color:#22C55E;opacity:0;transform:scale(.5);will-change:transform,opacity}
#time-debug{position:absolute;top:20px;right:20px;z-index:200;font-family:'Inter',monospace;font-size:24px;color:#22C55E;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:8px;display:none}
#flash{position:absolute;inset:0;z-index:50;background:#F4F1EC;opacity:0;pointer-events:none;will-change:opacity}
</style>
</head>

<div class="vignette"></div>
<div id="flash"></div>

<script>
(function(){
'use strict';
var SCENES=[
{id:1,start:0,end:2.5,text:'Você ainda perde horas organizando planos alimentares?',highlight:['horas','planos']},
{id:2,start:2.8,end:6.5,text:'Conheça o NutriFlow a plataforma feita para nutricionistas',highlight:['NutriFlow','nutricionistas']},
{id:3,start:6.8,end:12,text:'Gerencie pacientes crie planos personalizados e acompanhe resultados',highlight:['pacientes','resultados']},
{id:4,start:12.3,end:17,text:'Antes levava dias Agora você resolve em minutos',highlight:['dias','minutos']},
{id:5,start:17.3,end:22,text:'Mais tempo para o que importa cuidar dos seus pacientes',highlight:['tempo','cuidar']},
{id:6,start:22.3,end:30,text:'',highlight:[]}
];
var TOTAL=30;
var state='idle',startTime=0,pauseTime=0,elapsed=0,cdStart=0,rafId=null,showDebug=false;
var wrapper=document.getElementById('stage-wrapper');
var overlay=document.getElementById('start-overlay');
var cdEl=document.getElementById('countdown');
var cdNum=document.getElementById('countdown-num');
var flashEl=document.getElementById('flash');
var debugEl=document.getElementById('time-debug');
var blob1=document.getElementById('blob1');
var blob2=document.getElementById('blob2');
var blob3=document.getElementById('blob3');
function easeOutExpo(t){return t>=1?1:1-Math.pow(2,-10*t)}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v){return Math.max(0,Math.min(1,v))}
function buildWords(idx){
var sc=SCENES[idx];
var el=document.getElementById('s'+sc.id+'-title');
if(!el||!sc.text)return;
el.innerHTML='';
var words=sc.text.split(' ');
var dur=sc.end-sc.start;
var wd=dur/(words.length+1);
for(var i=0;i<words.length;i++){
var span=document.createElement('span');
span.className='word';
var clean=words[i].replace(/[^a-zA-ZÀ-ɏ0-9]/g,'');
if(sc.highlight.indexOf(clean)>=0)span.classList.add('highlight');
span.textContent=words[i]+' ';
span.dataset.delay=(i*wd).toFixed(3);
span.dataset.dur='0.4';
el.appendChild(span);
}
}
for(var i=0;i<SCENES.length;i++)buildWords(i);
function fitStage(){
var s=Math.min(window.innerWidth/1080,window.innerHeight/1920);
wrapper.style.transform='scale('+s+')';
}
window.addEventListener('resize',fitStage);
fitStage();
function render(t){
var gz=1+t*0.004;
document.getElementById('content').style.transform='scale('+gz+')';
var bt=t*0.15;
blob1.style.transform='translate('+Math.sin(bt)*60+'px,'+Math.cos(bt*0.7)*40+'px)';
blob2.style.transform='translate('+Math.cos(bt*0.8)*50+'px,'+Math.sin(bt*0.6)*50+'px)';
blob3.style.transform='translate('+Math.sin(bt*1.1)*40+'px,'+Math.cos(bt*0.9)*30+'px)';
var active=-1;
for(var i=0;i<SCENES.length;i++){
if(t>=SCENES[i].start&&t<=SCENES[i].end){active=i;break;}
}
for(var i=0;i<SCENES.length;i++){
var sc=SCENES[i];
var el=document.getElementById('scene'+sc.id);
var lt=t-sc.start;
if(i===active){
var fi=clamp(lt/0.4);
var fe=easeOutExpo(fi);
el.style.opacity=fe;
el.style.filter='blur('+(1-fe)*6+'px)';
el.style.transform='scale('+lerp(0.95,1,fe)+')';
var words=el.querySelectorAll('.word');
for(var w=0;w<words.length;w++){
var d=parseFloat(words[w].dataset.delay);
var du=parseFloat(words[w].dataset.dur);
var wt=clamp((lt-d)/du);
var we=easeOutExpo(wt);
words[w].style.opacity=we;
words[w].style.transform='translateY('+lerp(30,0,we)+'px)';
words[w].style.filter='blur('+lerp(8,0,we)+'px)';
}
renderVisuals(sc.id,lt);
}else if(t>sc.end&&t<sc.end+0.3){
var to=clamp((t-sc.end)/0.3);
el.style.opacity=1-easeOutCubic(to);
el.style.filter='blur('+to*8+'px)';
el.style.transform='scale('+lerp(1,1.05,to)+')';
}else{
el.style.opacity=0;
}
}
var fl=0;
for(var i=0;i<SCENES.length;i++){
var df=Math.abs(t-SCENES[i].start);
if(df<0.12)fl=Math.max(fl,(1-df/0.12)*0.12);
}
flashEl.style.opacity=fl;
if(showDebug)debugEl.textContent=t.toFixed(2)+'s';
}
function renderVisuals(id,lt){
if(id===1){
var c=document.getElementById('s1-clock');
var e=easeOutExpo(clamp(lt/0.5));
c.style.opacity=e;c.style.transform='scale('+lerp(0.5,1,e)+') rotate('+lt*30+'deg)';
}
if(id===2){
var logo=document.getElementById('s2-logo');
var le=easeOutExpo(clamp(lt/0.5));
logo.style.opacity=le;logo.style.transform='scale('+lerp(0.8,1,le)+')';
var m=document.getElementById('s2-mockup');
var e=easeOutExpo(clamp((lt-0.6)/0.5));
m.style.opacity=e;m.style.transform='translateY('+lerp(40,0,e)+'px) scale('+lerp(0.95,1,e)+')';
}
if(id===3){
var c=document.getElementById('s3-cards');
var e=easeOutExpo(clamp((lt-0.7)/0.5));
c.style.opacity=e;c.style.transform='translateY('+lerp(40,0,e)+'px)';
}
if(id===4){
var c=document.getElementById('s4-comp');
var e=easeOutExpo(clamp((lt-0.6)/0.5));
c.style.opacity=e;c.style.transform='translateY('+lerp(40,0,e)+'px)';
}
if(id===5){
var c=document.getElementById('s5-icons');
var e=easeOutExpo(clamp((lt-0.6)/0.5));
c.style.opacity=e;c.style.transform='translateY('+lerp(40,0,e)+'px)';
}
if(id===6){
var cta=document.getElementById('s6-cta');
var shine=document.getElementById('s6-shine');
var url=document.getElementById('s6-url');
var ce=easeOutExpo(clamp(lt/0.5));
cta.style.opacity=ce;cta.style.transform='scale('+lerp(0.8,1,ce)+')';
if(lt>0.6&&lt<4){
shine.style.opacity=1;
shine.style.backgroundPosition=((lt-0.6)/3*200-50)+'% center';
}else{shine.style.opacity=0;}
var ue=easeOutExpo(clamp((lt-0.8)/0.5));
url.style.opacity=ue;url.style.transform='translateY('+lerp(20,0,ue)+'px)';
}
}
function renderCD(num,frac){
cdNum.textContent=num;
var e=easeOutExpo(clamp(frac/0.3));
cdNum.style.opacity=e;cdNum.style.transform='scale('+lerp(0.5,1,e)+')';
if(frac>0.7)cdNum.style.opacity=1-clamp((frac-0.7)/0.3);
}
function tick(now){
if(state==='countdown'){
var ce=(now-cdStart)/1000;
var n=3-Math.floor(ce);
var f=ce%1;
if(n<=0){state='playing';cdEl.style.display='none';startTime=now;elapsed=0;rafId=requestAnimationFrame(tick);return;}
renderCD(n,f);rafId=requestAnimationFrame(tick);return;
}
if(state==='playing'){
elapsed=(now-startTime)/1000;
if(elapsed>=TOTAL){elapsed=TOTAL;state='ended';render(elapsed);document.body.classList.add('paused');return;}
render(elapsed);rafId=requestAnimationFrame(tick);return;
}
}
function startCD(){state='countdown';overlay.style.display='none';cdEl.style.display='flex';cdStart=performance.now();document.body.classList.remove('paused');rafId=requestAnimationFrame(tick);}
function togglePause(){
if(state==='idle'){startCD();return;}
if(state==='ended')return;
if(state==='playing'){state='paused';pauseTime=performance.now();cancelAnimationFrame(rafId);document.body.classList.add('paused');return;}
if(state==='paused'){startTime+=performance.now()-pauseTime;state='playing';document.body.classList.remove('paused');rafId=requestAnimationFrame(tick);return;}
}
function restart(){cancelAnimationFrame(rafId);state='idle';elapsed=0;overlay.style.display='flex';cdEl.style.display='none';document.body.classList.add('paused');for(var i=0;i<SCENES.length;i++)document.getElementById('scene'+SCENES[i].id).style.opacity=0;render(0);}
function jump(dir){
if(state!=='playing'&&state!=='paused')return;
var cur=-1;
for(var i=0;i<SCENES.length;i++){if(elapsed>=SCENES[i].start&&elapsed<=SCENES[i].end){cur=i;break;}}
var tgt=cur+dir;if(tgt<0)tgt=0;if(tgt>=SCENES.length)tgt=SCENES.length-1;
elapsed=SCENES[tgt].start+0.01;startTime=performance.now()-elapsed*1000;
if(state==='paused')render(elapsed);
}
document.addEventListener('keydown',function(e){
if(e.code==='Space'){e.preventDefault();togglePause();}
if(e.code==='KeyR')restart();
if(e.code==='ArrowRight')jump(1);
if(e.code==='ArrowLeft')jump(-1);
if(e.code==='KeyT'){showDebug=!showDebug;debugEl.style.display=showDebug?'block':'none';}
});
document.addEventListener('click',function(){if(state==='idle')startCD();});
render(0);
})();
</script>
</body>
</html>
