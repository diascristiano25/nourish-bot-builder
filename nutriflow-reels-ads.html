<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriFlow — Meta Ads 30s (Polished Fluid)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
:root {
--bg: #050505;
--text: #F4F1EC;
--accent: #22C55E;
--support: #3B82F6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
body.playing { cursor: none; }
body.paused { cursor: default; }

/* Stage */
#stage-wrap {
width: 100vw; height: 100vh;
display: flex; align-items: center; justify-content: center;
background: #000;
}
#stage {
width: 1080px; height: 1920px;
position: relative; overflow: hidden;
background: var(--bg);
transform-origin: center center;
}

/* Fluid Canvas Background - The "Goo" Effect */
#fluid-canvas {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
z-index: 0;
/* High contrast + blur creates the metaball merging effect */
filter: blur(40px) contrast(25);
opacity: 0.9;
}

/* Overlays */
.grain {
position: absolute; inset: 0; pointer-events: none; z-index: 10;
opacity: 0.08; mix-blend-mode: overlay;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.vignette {
position: absolute; inset: 0; pointer-events: none; z-index: 11;
background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.9) 100%);
}

/* Controls */
.screen {
position: absolute; inset: 0; z-index: 1000;
display: flex; align-items: center; justify-content: center; flex-direction: column;
background: rgba(5, 5, 5, 0.95);
backdrop-filter: blur(20px);
transition: opacity 0.5s;
}
.screen.hidden { opacity: 0; pointer-events: none; }
.start-text {
font-family: 'Space Grotesk', sans-serif;
font-size: 64px; font-weight: 700;
color: var(--text); text-align: center;
padding: 0 80px; line-height: 1.2;
text-shadow: 0 0 20px rgba(255,255,255,0.2);
}
.countdown-text {
font-family: 'Space Grotesk', sans-serif;
font-size: 300px; font-weight: 700;
color: var(--accent);
text-shadow: 0 0 80px var(--accent);
}

/* Debug */
#debug-timer {
position: absolute; top: 20px; left: 20px; z-index: 999;
font-family: monospace; font-size: 24px;
color: var(--accent); background: rgba(0,0,0,0.8);
padding: 10px 20px; border-radius: 8px;
display: none; border: 1px solid var(--accent);
}
#debug-timer.visible { display: block; }

/* Scenes */
.scene {
position: absolute; inset: 0; z-index: 20;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
padding: 280px 70px 670px 70px; /* Safe Area */
opacity: 0; pointer-events: none;
will-change: opacity, transform;
}

/* Typography - Massive & Glowing (No blend mode for readability) */
.word-container {
display: flex; flex-wrap: wrap; justify-content: center;
gap: 20px 30px; max-width: 940px;
z-index: 30;
}
.word {
font-family: 'Space Grotesk', sans-serif;
font-size: 110px; font-weight: 700;
color: #fff;
line-height: 0.95;
opacity: 0;
text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 10px 30px rgba(0,0,0,0.8);
will-change: transform, opacity, filter;
}
.word.hl {
color: var(--accent);
text-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent), 0 10px 30px rgba(0,0,0,0.8);
}
.word.hl-blue {
color: var(--support);
text-shadow: 0 0 40px var(--support), 0 0 80px var(--support), 0 10px 30px rgba(0,0,0,0.8);
}

/* Scene 1: Badge */
.alert-badge {
font-family: 'Space Grotesk', sans-serif;
font-size: 48px; font-weight: 700;
background: rgba(34, 197, 94, 0.1);
border: 2px solid var(--accent);
color: var(--accent);
padding: 20px 50px; border-radius: 100px;
margin-bottom: 50px; opacity: 0;
box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
backdrop-filter: blur(10px);
will-change: transform, opacity;
}

/* Scene 2: Pain (Abstract) */
.pain-visual {
position: relative; width: 600px; height: 400px;
margin-top: 50px;
perspective: 1000px;
}
.float-card {
position: absolute; width: 200px; height: 200px;
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 24px;
backdrop-filter: blur(10px);
display: flex; align-items: center; justify-content: center;
opacity: 0;
box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.float-card svg { width: 80px; height: 80px; stroke: var(--text); stroke-width: 1.5; fill: none; opacity: 0.7; }
#card1 { top: 0; left: 0; }
#card2 { bottom: 0; right: 0; border-color: rgba(59,130,246,0.3); }
#clock-ring {
position: absolute; top: 50%; left: 50%;
width: 300px; height: 300px;
border: 2px dashed var(--accent);
border-radius: 50%;
transform: translate(-50%, -50%);
opacity: 0;
box-shadow: 0 0 40px rgba(34, 197, 94, 0.4), inset 0 0 40px rgba(34, 197, 94, 0.2);
}

/* Scene 3: Solution (Screenshots) */
.screenshots {
display: flex; gap: 30px; margin-top: 60px;
perspective: 1500px;
}
.shot {
width: 280px; height: 500px;
border-radius: 30px; overflow: hidden;
border: 1px solid rgba(255,255,255,0.1);
box-shadow: 0 30px 60px rgba(0,0,0,0.6);
opacity: 0;
background: #111;
position: relative;
}
.shot::after {
content: ''; position: absolute; inset: 0;
background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 40%);
pointer-events: none;
}
.shot img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }

/* Scene 4: Benefit */
.benefit-visual {
position: relative; width: 700px; height: 400px;
margin-top: 60px;
}
.chart {
position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
display: flex; align-items: flex-end; gap: 20px;
opacity: 0;
}
.bar {
flex: 1; background: linear-gradient(to top, var(--support), var(--accent));
border-radius: 12px 12px 0 0;
transform-origin: bottom; transform: scaleY(0);
box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
}
.notif {
position: absolute; width: 100px; height: 100px;
background: rgba(34,197,94,0.05); border: 1px solid rgba(34,197,94,0.3);
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
opacity: 0;
box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
backdrop-filter: blur(5px);
}
.notif svg { width: 50px; height: 50px; fill: var(--accent); filter: drop-shadow(0 0 10px var(--accent)); }
#n1 { top: 10%; right: 0; }
#n2 { top: 50%; right: 20%; }
#n3 { top: 80%; right: 5%; }

/* Scene 5: CTA */
.cta-word {
font-family: 'Space Grotesk', sans-serif;
font-size: 220px; font-weight: 700;
color: var(--accent); text-align: center;
margin-bottom: 60px; opacity: 0;
text-shadow: 0 0 60px var(--accent), 0 0 120px var(--accent);
line-height: 0.8;
}
.comment-bar {
width: 800px; height: 90px;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 45px;
display: flex; align-items: center;
padding: 0 40px; opacity: 0;
backdrop-filter: blur(10px);
box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.comment-text {
font-size: 48px; color: var(--text); flex: 1; font-weight: 600;
}
.cursor {
width: 4px; height: 50px; background: var(--accent);
box-shadow: 0 0 15px var(--accent);
}
.know-more {
margin-top: 50px;
font-family: 'Space Grotesk', sans-serif;
font-size: 56px; font-weight: 700;
background: var(--accent); color: #000;
padding: 30px 90px; border-radius: 100px;
opacity: 0;
box-shadow: 0 0 50px var(--accent);
}

/* Logo */
.logo {
position: absolute; top: 120px; left: 50%;
transform: translateX(-50%);
width: 160px; height: 160px;
opacity: 0; z-index: 100;
filter: drop-shadow(0 0 30px var(--accent));
}
.logo img { width: 100%; height: 100%; object-fit: contain; }

/* Transition */
#trans-overlay {
position: absolute; inset: 0; z-index: 500;
background: var(--bg); opacity: 0; pointer-events: none;
}
</style>
</head>
<body class="paused">

<!-- Start -->
<div id="start-screen" class="screen">

</div>

</div>

</div>
</div>

<script>
/**
* NutriFlow Meta Ads - POLISHED FLUID EDITION
* High-performance Canvas Metaballs + Cinematic DOM UI
*/
const DUR = 30;
const SCENES = [
{ id: 'sc1', wId: 'w1', start: 0, end: 4, text: "Atenção, Nutricionista! Estamos selecionando profissionais para testar uma nova ferramenta exclusiva.", hl: ["Atenção,"], hl2: ["exclusiva."] },
{ id: 'sc2', wId: 'w2', start: 4.5, end: 9, text: "Chega de perder horas montando planos alimentares em planilhas.", hl: ["Chega"], hl2: ["horas"] },
{ id: 'sc3', wId: 'w3', start: 9.5, end: 16.5, text: "Conheça o NutriFlow. Automatize seus atendimentos e entregue tudo em minutos.", hl: ["NutriFlow."], hl2: ["minutos."] },
{ id: 'sc4', wId: 'w4', start: 17, end: 23, text: "Ganhe tempo livre e tenha pacientes muito mais engajados.", hl: ["tempo", "livre"], hl2: ["engajados."] },
{ id: 'sc5', wId: 'w5', start: 23.5, end: 30, text: "Vagas limitadas para o teste. Comente EU QUERO que te envio o acesso agora.", hl: ["limitadas"], hl2: ["EU", "QUERO"] }
];

let t = 0, playing = false, counting = false, cdVal = 3;
let raf = null, lastTs = null, debugOn = false;
let baseScale = 1;

const stage = document.getElementById('stage');
const startScr = document.getElementById('start-screen');
const cdScr = document.getElementById('countdown-screen');
const cdNum = document.getElementById('cd-num');
const dbg = document.getElementById('debug-timer');
const transOv = document.getElementById('trans-overlay');
const logoEl = document.getElementById('logo');
const canvas = document.getElementById('fluid-canvas');
const ctx = canvas.getContext('2d');

// Init Words
SCENES.forEach(sc => {
const c = document.getElementById(sc.wId);
sc.text.split(' ').forEach(word => {
const sp = document.createElement('span');
sp.className = 'word';
if (sc.hl.includes(word)) sp.classList.add('hl');
else if (sc.hl2.includes(word)) sp.classList.add('hl-blue');
sp.textContent = word;
c.appendChild(sp);
});
});

// Utils
const clamp = (v, min=0, max=1) => Math.min(Math.max(v, min), max);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutExpo = (x) => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeOutBack = (x) => { const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

// Fluid Particles (Metaballs) - Tuned for "Goo" effect
const blobs = [
{ x: 300, y: 400, r: 350, color: '34, 197, 94', phase: 0, speed: 0.15 },
{ x: 800, y: 1200, r: 450, color: '59, 130, 246', phase: 2, speed: 0.12 },
{ x: 500, y: 1600, r: 300, color: '34, 197, 94', phase: 4, speed: 0.18 },
{ x: 200, y: 1000, r: 400, color: '59, 130, 246', phase: 1, speed: 0.14 },
{ x: 900, y: 300, r: 250, color: '255, 255, 255', phase: 3, speed: 0.2 } // White highlight for pop
];

function drawFluid(t) {
ctx.clearRect(0, 0, 1080, 1920);
// Use lighter composite for glowing overlap before the CSS contrast filter hits it
ctx.globalCompositeOperation = 'lighter';

blobs.forEach(b => {
// Organic sine wave movement - slow and heavy
const offsetX = Math.sin(t * b.speed + b.phase) * 300;
const offsetY = Math.cos(t * b.speed * 0.8 + b.phase) * 300;
const currentX = b.x + offsetX;
const currentY = b.y + offsetY;

// Pulsing radius
const currentR = b.r + Math.sin(t * b.speed * 2) * 60;

// Draw soft gradient circle - the core needs to be bright for the contrast filter to work
const grad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, currentR);
grad.addColorStop(0, `rgba(${b.color}, 1)`); // Solid core
grad.addColorStop(0.4, `rgba(${b.color}, 0.8)`); // Strong mid
grad.addColorStop(1, `rgba(${b.color}, 0)`); // Fade out

ctx.fillStyle = grad;
ctx.beginPath();
ctx.arc(currentX, currentY, currentR, 0, Math.PI * 2);
ctx.fill();
});
}

function fitStage() {
const sx = window.innerWidth / 1080;
const sy = window.innerHeight / 1920;
baseScale = Math.min(sx, sy);
stage.style.transform = `scale(${baseScale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

// Main Render
function render(t) {
if (debugOn) dbg.textContent = t.toFixed(2) + 's';

// Camera Zoom
const zoom = 1 + (t / DUR) * 0.08;
stage.style.transform = `scale(${baseScale * zoom})`;

// Draw Fluid
drawFluid(t);

// Logo
const lp = clamp(t / 1.5);
logoEl.style.opacity = easeOutExpo(lp);
logoEl.style.transform = `translateX(-50%) translateY(${lerp(50, 0, easeOutExpo(lp))}px)`;

// Scene Logic
let activeIdx = -1;
for (let i = 0; i < SCENES.length; i++) {
if (t >= SCENES[i].start && t < SCENES[i].end) { activeIdx = i; break; }
}
if (activeIdx === -1 && t >= SCENES[SCENES.length - 1].end) activeIdx = SCENES.length - 1;

for (let i = 0; i < SCENES.length; i++) {
const el = document.getElementById(SCENES[i].id);
if (i === activeIdx) {
el.style.opacity = 1;
el.style.pointerEvents = 'auto';
renderScene(i, t);
} else {
el.style.opacity = 0;
el.style.pointerEvents = 'none';
}
}

// Transitions
transOv.style.opacity = 0;
for (let i = 0; i < SCENES.length - 1; i++) {
const gapStart = SCENES[i].end;
const gapEnd = SCENES[i + 1].start;
if (t >= gapStart && t < gapEnd) {
const p = (t - gapStart) / (gapEnd - gapStart);
transOv.style.opacity = Math.sin(p * Math.PI);
}
}
}

function renderScene(idx, t) {
const sc = SCENES[idx];
const dur = sc.end - sc.start;
const p = clamp((t - sc.start) / dur);

// Text Animation
const wCont = document.getElementById(sc.wId);
const spans = wCont.querySelectorAll('.word');
const wordDur = dur / (spans.length + 1);

spans.forEach((sp, i) => {
const wStart = i * wordDur;
const wp = clamp((t - sc.start - wStart) / 0.6);
const e = easeOutBack(wp);
sp.style.opacity = clamp(wp * 2);
sp.style.transform = `translateY(${lerp(60, 0, e)}px) scale(${lerp(0.8, 1, e)})`;
sp.style.filter = `blur(${lerp(10, 0, wp)}px)`;
});

// Specifics
if (idx === 0) {
const badge = document.getElementById('badge');
const bp = easeOutBack(clamp(p * 3));
badge.style.opacity = clamp(bp);
badge.style.transform = `scale(${lerp(0.5, 1, bp)})`;
}
else if (idx === 1) {
const c1 = document.getElementById('card1');
const c2 = document.getElementById('card2');
const ring = document.getElementById('clock-ring');
const sp = easeOutExpo(clamp(p * 2));
c1.style.opacity = sp;
c1.style.transform = `translate(${lerp(-50, 0, sp)}px, ${lerp(-50, 0, sp)}px) rotate(${lerp(-20, -10, sp)}deg)`;
c2.style.opacity = sp;
c2.style.transform = `translate(${lerp(50, 0, sp)}px, ${lerp(50, 0, sp)}px) rotate(${lerp(20, 10, sp)}deg)`;
const rp = easeOutExpo(clamp((p - 0.3) * 2));
ring.style.opacity = rp;
ring.style.transform = `translate(-50%, -50%) scale(${lerp(0.5, 1, rp)}) rotate(${t * 40}deg)`;
if (p > 0.6) {
const cp = easeOutExpo(clamp((p - 0.6) * 2.5));
c1.style.transform = `translate(${lerp(0, -100, cp)}px, ${lerp(0, 100, cp)}px) rotate(${lerp(-10, -45, cp)}deg)`;
c1.style.opacity = 1 - cp;
c2.style.transform = `translate(${lerp(0, 100, cp)}px, ${lerp(0, -50, cp)}px) rotate(${lerp(10, 30, cp)}deg)`;
c2.style.opacity = 1 - cp;
}
}
else if (idx === 2) {
const shots = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
shots.forEach((el, i) => {
const delay = i * 0.15;
const sp = easeOutBack(clamp((p - delay) * 2));
el.style.opacity = clamp(sp);
el.style.transform = `translateY(${lerp(100, 0, sp)}px) rotateY(${lerp(-30, 0, sp)}deg) scale(${lerp(0.8, 1, sp)})`;
const float = Math.sin(t * 2 + i) * 10 * clamp(sp);
el.style.transform += ` translateY(${float}px)`;
});
}
else if (idx === 3) {
const chart = document.getElementById('chart');
const bars = chart.querySelectorAll('.bar');
const cp = easeOutExpo(clamp(p * 2));
chart.style.opacity = cp;
bars.forEach((bar, i) => {
const delay = i * 0.1;
const bp = easeOutBack(clamp((p - delay) * 2));
bar.style.transform = `scaleY(${bp})`;
});
const notifs = [document.getElementById('n1'), document.getElementById('n2'), document.getElementById('n3')];
notifs.forEach((el, i) => {
const delay = 0.4 + i * 0.1;
const np = easeOutBack(clamp((p - delay) * 2.5));
el.style.opacity = clamp(np);
el.style.transform = `scale(${lerp(0, 1, np)})`;
const pulse = 1 + Math.sin(t * 4 + i) * 0.1 * clamp(np);
el.style.transform += ` scale(${pulse})`;
});
}
else if (idx === 4) {
const cta = document.getElementById('cta');
const bar = document.getElementById('cmt-bar');
const txt = document.getElementById('cmt-txt');
const cur = document.getElementById('cmt-cur');
const btn = document.getElementById('btn');

const cp = easeOutBack(clamp(p * 2.5));
cta.style.opacity = clamp(cp);
cta.style.transform = `scale(${lerp(0.5, 1, cp)})`;
const glow = 60 + Math.sin(t * 5) * 20;
cta.style.textShadow = `0 0 ${glow}px var(--accent), 0 0 ${glow*2}px var(--accent)`;

const bp = easeOutExpo(clamp((p - 0.2) * 2));
bar.style.opacity = bp;
bar.style.transform = `translateY(${lerp(40, 0, bp)}px)`;

const typeP = clamp((p - 0.3) * 3);
const full = "EU QUERO";
txt.textContent = full.substring(0, Math.floor(typeP * full.length));
cur.style.opacity = (Math.sin(t * 10) > 0) ? 1 : 0;

const btnP = easeOutBack(clamp((p - 0.5) * 2));
btn.style.opacity = clamp(btnP);
btn.style.transform = `scale(${lerp(0.5, 1, btnP)})`;
const btnPulse = 1 + Math.sin(t * 6) * 0.05 * clamp(btnP);
btn.style.transform += ` scale(${btnPulse})`;
}
}

// Loop
function tick(ts) {
if (!lastTs) lastTs = ts;
const dt = (ts - lastTs) / 1000;
lastTs = ts;
if (playing && !counting) {
t += dt;
if (t >= DUR) {
t = DUR;
playing = false;
document.body.classList.replace('playing', 'paused');
}
render(t);
}
raf = requestAnimationFrame(tick);
}

// Controls
function togglePlay() {
if (counting) return;
if (!playing && t === 0) startCountdown();
else if (!playing && t >= DUR) restart();
else {
playing = !playing;
document.body.classList.toggle('playing', playing);
document.body.classList.toggle('paused', !playing);
if (playing) lastTs = null;
}
}

function startCountdown() {
counting = true; cdVal = 3;
startScr.classList.add('hidden');
cdScr.classList.remove('hidden');
cdNum.textContent = cdVal;
const iv = setInterval(() => {
cdVal--;
if (cdVal > 0) cdNum.textContent = cdVal;
else {
clearInterval(iv);
cdScr.classList.add('hidden');
counting = false; playing = true; lastTs = null;
document.body.classList.replace('paused', 'playing');
}
}, 1000);
}

function restart() {
t = 0; playing = false; counting = false;
document.body.classList.replace('playing', 'paused');
startScr.classList.remove('hidden');
cdScr.classList.add('hidden');
render(0);
}

function jumpScene(dir) {
let cur = SCENES.findIndex(s => t >= s.start && t < s.end);
if (cur === -1) cur = 0;
let next = cur + dir;
if (next < 0) next = 0;
if (next >= SCENES.length) next = SCENES.length - 1;
t = SCENES[next].start;
render(t);
}

document.addEventListener('click', togglePlay);
document.addEventListener('keydown', e => {
if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
if (e.code === 'KeyR') restart();
if (e.code === 'ArrowLeft') jumpScene(-1);
if (e.code === 'ArrowRight') jumpScene(1);
if (e.code === 'KeyT') { debugOn = !debugOn; dbg.classList.toggle('visible'); }
});

raf = requestAnimationFrame(tick);
render(0);
</script>
