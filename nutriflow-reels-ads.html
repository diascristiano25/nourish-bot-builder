<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriFlow — Meta Ads Reels 30s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',sans-serif}
body.playing{cursor:none}
body.paused{cursor:default}

/* ── Stage container ── */
#stage-wrap{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
#stage{
  width:1080px;height:1920px;
  position:relative;overflow:hidden;
  background:#0A0A0F;
  transform-origin:center center;
  /* scale set by JS */
}

/* ── Fundo vivo: blobs ── */
.blob{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
.blob-a{width:700px;height:700px;background:radial-gradient(circle,rgba(34,197,94,.35),transparent 70%);filter:blur(100px);top:-250px;left:-200px}
.blob-b{width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.30),transparent 70%);filter:blur(100px);bottom:-200px;right:-180px}
.blob-c{width:500px;height:500px;background:radial-gradient(circle,rgba(34,197,94,.20),transparent 70%);filter:blur(90px);top:45%;left:55%}

/* ── Granulado ── */
.grain{
  position:absolute;inset:0;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}

/* ── Vinheta ── */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%);
}

/* ── Overlay de transição (flash/zoom-blur) ── */
#trans-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:800;
  background:#0A0A0F;opacity:0;
  will-change:opacity,filter;
}

/* ── Telas de controle ── */
.ctrl-screen{
  position:absolute;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:#0A0A0F;
}
.ctrl-screen.hidden{display:none}
#start-screen .label{
  font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;
  color:#F4F1EC;text-align:center;padding:0 80px;line-height:1.5;
}
#start-screen .sub{
  font-family:'Inter',sans-serif;font-size:36px;color:rgba(244,241,236,.5);
  margin-top:30px;
}
#countdown-screen .num{
  font-family:'Space Grotesk',sans-serif;font-size:260px;font-weight:700;
  color:#22C55E;
}

/* ── Debug timer ── */
#debug{
  position:absolute;top:20px;left:20px;z-index:950;
  font-family:'Inter',monospace;font-size:28px;color:#22C55E;
  background:rgba(0,0,0,.75);padding:10px 22px;border-radius:10px;
  display:none;
}
#debug.on{display:block}

/* ── Logo ── */
#logo{
  position:absolute;top:100px;left:50%;
  width:130px;height:130px;
  transform:translateX(-50%);
  opacity:0;will-change:opacity,transform;
  z-index:100;
}
#logo img{width:100%;height:100%;object-fit:contain}

/* ── Scenes ── */
.scene{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;
  /* Área segura: top 280px, bottom 1250px → conteúdo entre y=280 e y=1250 */
  padding:280px 70px 0 70px;
  opacity:0;pointer-events:none;
  will-change:opacity,transform,filter;
}

/* ── Word containers ── */
.words{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:16px 22px;
  max-width:940px;
}
.w{
  font-family:'Space Grotesk',sans-serif;
  font-size:96px;font-weight:700;
  color:#F4F1EC;line-height:1.15;
  opacity:0;
  will-change:opacity,transform,filter;
}
.w.hl{color:#22C55E}
.w.hl2{color:#3B82F6}

/* ── Cena 1: badge ATENÇÃO ── */
#badge{
  font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;
  background:#22C55E;color:#0A0A0F;
  padding:18px 48px;border-radius:14px;
  margin-bottom:36px;
  opacity:0;will-change:opacity,transform;
}

/* ── Cena 2: visuais de dor ── */
#pain-vis{
  position:relative;width:700px;height:380px;margin-top:30px;
}
.sheet{
  position:absolute;width:180px;height:180px;opacity:0;
  will-change:opacity,transform;
}
.sheet svg{width:100%;height:100%}
#clock-vis{
  position:absolute;top:50%;left:50%;
  width:260px;height:260px;
  transform:translate(-50%,-50%);
  opacity:0;will-change:opacity,transform;
}
#clock-vis svg{width:100%;height:100%}

/* ── Cena 3: screenshots ── */
#shots{
  display:flex;gap:24px;margin-top:30px;
  perspective:1200px;
}
.shot{
  width:270px;height:480px;
  border-radius:22px;overflow:hidden;
  border:3px solid rgba(34,197,94,.6);
  box-shadow:0 16px 48px rgba(0,0,0,.6);
  opacity:0;will-change:opacity,transform;
}
.shot img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Cena 4: benefício ── */
#benefit-vis{
  position:relative;width:800px;height:360px;margin-top:30px;
}
#chart{
  position:absolute;left:0;bottom:0;
  width:380px;height:300px;
  display:flex;align-items:flex-end;gap:18px;
  opacity:0;will-change:opacity;
}
.bar{
  width:65px;border-radius:10px 10px 0 0;
  background:linear-gradient(to top,#22C55E,#3B82F6);
  transform-origin:bottom;
  will-change:transform;
}
#notifs{
  position:absolute;right:0;top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:22px;
}
.notif{
  width:110px;height:110px;
  border-radius:50%;
  background:rgba(34,197,94,.15);
  border:2.5px solid #22C55E;
  display:flex;align-items:center;justify-content:center;
  opacity:0;will-change:opacity,transform;
}
.notif svg{width:52px;height:52px;fill:#22C55E}

/* ── Cena 5: CTA ── */
#cta-big{
  font-family:'Space Grotesk',sans-serif;
  font-size:170px;font-weight:700;
  color:#22C55E;text-align:center;
  margin-bottom:40px;
  opacity:0;will-change:opacity,transform;
  position:relative;overflow:hidden;
}
/* Shine sweep — driven by JS, not CSS animation */
#cta-shine{
  position:absolute;top:0;left:-120%;
  width:80%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  pointer-events:none;
  will-change:transform;
}
#comment-bar{
  width:820px;height:76px;
  background:rgba(255,255,255,.08);
  border:2.5px solid #3B82F6;
  border-radius:38px;
  display:flex;align-items:center;
  padding:0 28px;gap:12px;
  opacity:0;will-change:opacity,transform;
}
#comment-txt{
  font-family:'Inter',sans-serif;font-size:42px;
  color:#F4F1EC;flex:1;
}
#comment-cursor{
  width:3px;height:48px;background:#22C55E;
  opacity:1;will-change:opacity;
}
#saiba-mais{
  margin-top:36px;
  font-family:'Space Grotesk',sans-serif;font-size:50px;font-weight:700;
  background:#22C55E;color:#0A0A0F;
  padding:28px 80px;border-radius:18px;
  box-shadow:0 8px 32px rgba(34,197,94,.45);
  opacity:0;will-change:opacity,transform;
}
</style>
</head>
<body class="paused">

<script>
/* ================================================================
   NutriFlow Meta Ads Reels — 30 s
   Single-clock render(t) architecture. No loose CSS animations.
   ================================================================ */

// ── Config ──
const DUR = 30;
const SCENES = [
  { id:'sc1', wId:'w1', start:0,    end:4,
    text:"Atenção, Nutricionista! Estamos selecionando profissionais para testar uma nova ferramenta exclusiva.",
    hl:["Atenção,"], hl2:["exclusiva."] },
  { id:'sc2', wId:'w2', start:4.5,  end:9,
    text:"Chega de perder horas montando planos alimentares em planilhas.",
    hl:["Chega"], hl2:["horas"] },
  { id:'sc3', wId:'w3', start:9.5,  end:16.5,
    text:"Conheça o NutriFlow. Automatize seus atendimentos e entregue tudo em minutos.",
    hl:["NutriFlow."], hl2:["minutos."] },
  { id:'sc4', wId:'w4', start:17,   end:23,
    text:"Ganhe tempo livre e tenha pacientes muito mais engajados.",
    hl:["tempo","livre"], hl2:["engajados."] },
  { id:'sc5', wId:'w5', start:23.5, end:30,
    text:"Vagas limitadas para o teste. Comente EU QUERO que te envio o acesso agora.",
    hl:["limitadas"], hl2:["EU","QUERO"] }
];

// ── State ──
let t = 0, playing = false, counting = false, cdVal = 3;
let raf = null, lastTs = null, debugOn = false;
let baseScale = 1;

// ── DOM refs ──
const stage      = document.getElementById('stage');
const startScr   = document.getElementById('start-screen');
const cdScr      = document.getElementById('countdown-screen');
const cdNum      = document.getElementById('cd-num');
const dbg        = document.getElementById('debug');
const transOv    = document.getElementById('trans-overlay');
const logoEl     = document.getElementById('logo');
const blobA      = document.getElementById('blobA');
const blobB      = document.getElementById('blobB');
const blobC      = document.getElementById('blobC');

// ── Scale stage to fit viewport ──
function fitStage(){
  const sx = window.innerWidth / 1080;
  const sy = window.innerHeight / 1920;
  baseScale = Math.min(sx, sy);
  applyTransform(0);
}
function applyTransform(zoomExtra){
  const s = baseScale * (1 + zoomExtra);
  stage.style.transform = 'scale('+s+')';
}
fitStage();
window.addEventListener('resize', fitStage);

// ── Easing ──
function easeOut(t){ return t>=1?1:1-Math.pow(2,-10*t); }
function clamp01(v){ return v<0?0:v>1?1:v; }
function lerp(a,b,p){ return a+(b-a)*p; }

// ── Build word spans ──
SCENES.forEach(sc=>{
  const c = document.getElementById(sc.wId);
  sc.text.split(' ').forEach(word=>{
    const sp = document.createElement('span');
    sp.className = 'w';
    if(sc.hl.some(h=>word===h)) sp.classList.add('hl');
    else if(sc.hl2.some(h=>word===h)) sp.classList.add('hl2');
    sp.textContent = word;
    c.appendChild(sp);
  });
});

// ── RENDER(t) — the single clock ──
function render(t){
  if(debugOn) dbg.textContent = t.toFixed(2)+'s';

  // Continuous slow zoom (0 → 5% over 30s)
  const zoom = (t/DUR)*0.05;
  applyTransform(zoom);

  // Blobs drift
  blobA.style.transform = 'translate('+Math.sin(t*0.28)*55+'px,'+Math.cos(t*0.19)*45+'px)';
  blobB.style.transform = 'translate('+Math.cos(t*0.22)*65+'px,'+Math.sin(t*0.31)*55+'px)';
  blobC.style.transform = 'translate('+Math.sin(t*0.35)*40+'px,'+Math.cos(t*0.26)*35+'px)';

  // Logo fade in
  const logoP = clamp01(t/0.8);
  logoEl.style.opacity = easeOut(logoP);
  logoEl.style.transform = 'translateX(-50%) translateY('+lerp(20,0,easeOut(logoP))+'px)';

  // Determine active scene
  let activeIdx = -1;
  for(let i=0;i<SCENES.length;i++){
    if(t>=SCENES[i].start && t<SCENES[i].end){ activeIdx=i; break; }
  }
  // If past last scene end, keep last active
  if(activeIdx===-1 && t>=SCENES[SCENES.length-1].end) activeIdx=SCENES.length-1;

  // Scene visibility + per-scene render
  for(let i=0;i<SCENES.length;i++){
    const el = document.getElementById(SCENES[i].id);
    if(i===activeIdx){
      el.style.opacity = '1';
      el.style.pointerEvents = 'auto';
      renderScene(i, t);
    } else {
      el.style.opacity = '0';
      el.style.pointerEvents = 'none';
    }
  }

  // Transitions between scenes (flash overlay)
  transOv.style.opacity = '0';
  transOv.style.filter = 'blur(0px)';
  for(let i=0;i<SCENES.length-1;i++){
    const gapStart = SCENES[i].end;
    const gapEnd   = SCENES[i+1].start;
    if(t>=gapStart && t<gapEnd){
      const p = (t-gapStart)/(gapEnd-gapStart);
      const flash = Math.sin(p*Math.PI);
      transOv.style.opacity = (flash*0.85).toFixed(3);
      transOv.style.filter = 'blur('+lerp(0,12,flash).toFixed(1)+'px)';
    }
  }
}

// ── Per-scene rendering ──
function renderScene(idx, t){
  const sc = SCENES[idx];
  const dur = sc.end - sc.start;
  const p = clamp01((t - sc.start)/dur);

  // Words: stagger entry
  const wCont = document.getElementById(sc.wId);
  const spans = wCont.querySelectorAll('.w');
  const perWord = dur / (spans.length + 1);
  spans.forEach((sp,i)=>{
    const wStart = i * perWord;
    const wp = clamp01((t - sc.start - wStart)/0.55);
    const e = easeOut(wp);
    sp.style.opacity = e;
    sp.style.transform = 'translateY('+lerp(45,0,e).toFixed(1)+'px)';
    sp.style.filter = 'blur('+lerp(12,0,e).toFixed(1)+'px)';
  });

  switch(idx){
    case 0: renderScene1(p, t); break;
    case 1: renderScene2(p, t); break;
    case 2: renderScene3(p, t); break;
    case 3: renderScene4(p, t); break;
    case 4: renderScene5(p, t); break;
  }
}

// Cena 1 — Gancho
function renderScene1(p, t){
  const badge = document.getElementById('badge');
  const bp = easeOut(clamp01(p*3.5));
  badge.style.opacity = bp;
  badge.style.transform = 'scale('+lerp(0.7,1,bp).toFixed(3)+')';
}

// Cena 2 — Dor
function renderScene2(p, t){
  const sh1 = document.getElementById('sh1');
  const sh2 = document.getElementById('sh2');
  const clk = document.getElementById('clock-vis');

  const sp = easeOut(clamp01(p*2.2));
  sh1.style.opacity = sp;
  sh1.style.transform = 'translateY('+lerp(60,0,sp).toFixed(1)+'px) rotate('+lerp(-12,0,sp).toFixed(1)+'deg)';
  sh2.style.opacity = sp;
  sh2.style.transform = 'translateY('+lerp(60,0,sp).toFixed(1)+'px) rotate('+lerp(12,0,sp).toFixed(1)+'deg)';

  // Clock appears later, spins
  const cp = easeOut(clamp01((p-0.25)*2));
  clk.style.opacity = cp;
  const rot = p * 540; // 1.5 full rotations over scene
  clk.style.transform = 'translate(-50%,-50%) scale('+lerp(0.4,1,cp).toFixed(3)+') rotate('+rot.toFixed(1)+'deg)';

  // Sheets crumble/fall in second half
  if(p > 0.55){
    const fp = easeOut(clamp01((p-0.55)*2.5));
    sh1.style.transform = 'translateY('+lerp(0,120,fp).toFixed(1)+'px) rotate('+lerp(0,-25,fp).toFixed(1)+'deg)';
    sh1.style.opacity = lerp(1,0.15,fp).toFixed(3);
    sh2.style.transform = 'translateY('+lerp(0,100,fp).toFixed(1)+'px) rotate('+lerp(0,20,fp).toFixed(1)+'deg)';
    sh2.style.opacity = lerp(1,0.15,fp).toFixed(3);
  }
}

// Cena 3 — Solução (screenshots cascade)
function renderScene3(p, t){
  const shots = [document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3')];
  shots.forEach((el,i)=>{
    const delay = i*0.15;
    const sp = easeOut(clamp01((p-delay)*2.5));
    el.style.opacity = sp;
    el.style.transform = 'translateY('+lerp(120,0,sp).toFixed(1)+'px) rotateY('+lerp(-18,0,sp).toFixed(1)+'deg) scale('+lerp(0.85,1,sp).toFixed(3)+')';
  });
}

// Cena 4 — Benefício
function renderScene4(p, t){
  const chart = document.getElementById('chart');
  const bars = chart.querySelectorAll('.bar');
  const cp = easeOut(clamp01(p*2));
  chart.style.opacity = cp;

  bars.forEach((bar,i)=>{
    const delay = i*0.08;
    const bp = easeOut(clamp01((p-delay)*2.5));
    bar.style.transform = 'scaleY('+bp.toFixed(3)+')';
  });

  const notifs = [document.getElementById('n1'),document.getElementById('n2'),document.getElementById('n3')];
  notifs.forEach((el,i)=>{
    const delay = 0.3+i*0.12;
    const np = easeOut(clamp01((p-delay)*2.5));
    el.style.opacity = np;
    el.style.transform = 'scale('+lerp(0.3,1,np).toFixed(3)+')';
  });
}

// Cena 5 — CTA
function renderScene5(p, t){
  const ctaBig   = document.getElementById('cta-big');
  const shine    = document.getElementById('cta-shine');
  const cBar     = document.getElementById('comment-bar');
  const cTxt     = document.getElementById('comment-txt');
  const cursor   = document.getElementById('comment-cursor');
  const saibaBtn = document.getElementById('saiba-mais');

  // CTA word
  const cp = easeOut(clamp01(p*2.5));
  ctaBig.style.opacity = cp;
  ctaBig.style.transform = 'scale('+lerp(0.7,1,cp).toFixed(3)+')';

  // Shine sweep (driven by t, not CSS animation)
  const shineCycle = ((t*0.8)%2)/2; // 0→1 every 2.5s
  const shineX = lerp(-120, 220, shineCycle);
  shine.style.transform = 'translateX('+shineX.toFixed(1)+'%)';

  // Comment bar
  const barP = easeOut(clamp01((p-0.15)*2.5));
  cBar.style.opacity = barP;
  cBar.style.transform = 'translateY('+lerp(35,0,barP).toFixed(1)+'px)';

  // Typing effect
  const fullText = 'EU QUERO';
  const typeP = clamp01((p-0.25)*2.5);
  const chars = Math.floor(typeP * fullText.length);
  cTxt.textContent = fullText.substring(0, chars);

  // Cursor blink (driven by t)
  cursor.style.opacity = (Math.sin(t*6)>0)?'1':'0';

  // Saiba Mais button
  const btnP = easeOut(clamp01((p-0.45)*2.5));
  saibaBtn.style.opacity = btnP;
  saibaBtn.style.transform = 'scale('+lerp(0.7,1,btnP).toFixed(3)+')';

  // Pulse effect on button in last 3 seconds (p > 0.62 ≈ last 2.5s of scene)
  if(p > 0.62){
    const pulse = 1 + Math.sin((t-23.5)*4)*0.04;
    saibaBtn.style.transform = 'scale('+(pulse).toFixed(3)+')';
  }
}

// ── Animation loop ──
function tick(ts){
  if(!lastTs) lastTs = ts;
  const dt = (ts - lastTs)/1000;
  lastTs = ts;

  if(playing && !counting){
    t += dt;
    if(t >= DUR){
      t = DUR;
      playing = false;
      document.body.classList.remove('playing');
      document.body.classList.add('paused');
    }
    render(t);
  }
  raf = requestAnimationFrame(tick);
}

// ── Countdown ──
function startCountdown(){
  counting = true;
  cdVal = 3;
  startScr.classList.add('hidden');
  cdScr.classList.remove('hidden');
  cdNum.textContent = cdVal;

  const iv = setInterval(()=>{
    cdVal--;
    if(cdVal > 0){
      cdNum.textContent = cdVal;
    } else {
      clearInterval(iv);
      cdScr.classList.add('hidden');
      counting = false;
      playing = true;
      lastTs = null;
      document.body.classList.remove('paused');
      document.body.classList.add('playing');
    }
  }, 1000);
}

// ── Controls ──
function togglePlay(){
  if(counting) return;
  if(!playing && t===0){
    startCountdown();
  } else if(!playing && t>=DUR){
    // restart from beginning
    restart();
    startCountdown();
  } else {
    playing = !playing;
    if(playing){
      lastTs = null;
      document.body.classList.remove('paused');
      document.body.classList.add('playing');
    } else {
      document.body.classList.remove('playing');
      document.body.classList.add('paused');
    }
  }
}

function restart(){
  t = 0; playing = false; counting = false;
  document.body.classList.remove('playing');
  document.body.classList.add('paused');
  startScr.classList.remove('hidden');
  cdScr.classList.add('hidden');
  render(0);
}

function jumpScene(dir){
  let cur = -1;
  for(let i=0;i<SCENES.length;i++){
    if(t>=SCENES[i].start && t<SCENES[i].end){ cur=i; break; }
  }
  if(cur===-1) cur = 0;
  let ni = cur + dir;
  if(ni<0) ni=0;
  if(ni>=SCENES.length) ni=SCENES.length-1;
  t = SCENES[ni].start;
  render(t);
}

function toggleDebug(){
  debugOn = !debugOn;
  dbg.classList.toggle('on', debugOn);
}

// ── Event listeners ──
document.addEventListener('click', togglePlay);
document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code==='KeyR'){ restart(); }
  else if(e.code==='ArrowLeft'){ jumpScene(-1); }
  else if(e.code==='ArrowRight'){ jumpScene(1); }
  else if(e.code==='KeyT'){ toggleDebug(); }
});

// ── Init ──
raf = requestAnimationFrame(tick);
render(0);
</script>
