<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriFlow - Meta Ads Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  cursor: none;
}

body.paused {
  cursor: default;
}

#stage-container {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

#stage {
  width: 1080px;
  height: 1920px;
  background: #0A0A0F;
  position: relative;
  overflow: hidden;
  transform-origin: center center;
}

/* Fundo vivo */
.bg-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.3;
  pointer-events: none;
}

.blob-1 {
  width: 600px;
  height: 600px;
  background: #22C55E;
  top: -200px;
  left: -200px;
}

.blob-2 {
  width: 500px;
  height: 500px;
  background: #3B82F6;
  bottom: -150px;
  right: -150px;
}

.blob-3 {
  width: 400px;
  height: 400px;
  background: #22C55E;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Granulado */
.grain {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.03;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* Vinheta */
.vignette {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
}

/* Telas de controle */
.screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 1000;
  background: #0A0A0F;
}

.screen.hidden {
  display: none;
}

.start-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 60px;
  color: #F4F1EC;
  text-align: center;
  padding: 0 70px;
  line-height: 1.4;
}

.countdown-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 200px;
  font-weight: 700;
  color: #22C55E;
}

/* Debug timer */
#debug-timer {
  position: absolute;
  top: 20px;
  left: 20px;
  font-family: 'Inter', monospace;
  font-size: 24px;
  color: #22C55E;
  background: rgba(0,0,0,0.7);
  padding: 10px 20px;
  border-radius: 8px;
  z-index: 999;
  display: none;
}

#debug-timer.visible {
  display: block;
}

/* Conteúdo das cenas */
.scene {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 70px;
  opacity: 0;
  pointer-events: none;
}

.scene.active {
  opacity: 1;
  pointer-events: auto;
}

/* Texto palavra por palavra */
.word-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-bottom: 60px;
}

.word {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 90px;
  font-weight: 700;
  color: #F4F1EC;
  opacity: 0;
  transform: translateY(40px);
  filter: blur(10px);
  line-height: 1.2;
}

.word.highlight {
  color: #22C55E;
}

.word.visible {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
}

/* Cena 1 - Gancho */
.alert-badge {
  background: #22C55E;
  color: #0A0A0F;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 48px;
  font-weight: 700;
  padding: 20px 40px;
  border-radius: 12px;
  margin-bottom: 40px;
  opacity: 0;
  transform: scale(0.8);
}

.alert-badge.visible {
  opacity: 1;
  transform: scale(1);
}

/* Cena 2 - Dor */
.pain-visual {
  position: relative;
  width: 600px;
  height: 400px;
  margin-top: 40px;
}

.spreadsheet-icon {
  position: absolute;
  width: 200px;
  height: 200px;
  opacity: 0;
}

.spreadsheet-icon svg {
  width: 100%;
  height: 100%;
}

.clock-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  opacity: 0;
}

.clock-icon svg {
  width: 100%;
  height: 100%;
}

/* Cena 3 - Solução */
.screenshots-container {
  display: flex;
  gap: 30px;
  margin-top: 40px;
  perspective: 1000px;
}

.screenshot {
  width: 280px;
  height: 500px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(34, 197, 94, 0.3);
  opacity: 0;
  transform: translateY(100px) rotateY(-15deg);
  border: 3px solid #22C55E;
}

.screenshot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.screenshot.visible {
  opacity: 1;
  transform: translateY(0) rotateY(0);
}

/* Cena 4 - Benefício */
.benefit-visual {
  position: relative;
  width: 700px;
  height: 400px;
  margin-top: 40px;
}

.chart-container {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 350px;
  height: 300px;
  opacity: 0;
}

.chart-bar {
  position: absolute;
  bottom: 0;
  width: 60px;
  background: linear-gradient(to top, #22C55E, #3B82F6);
  border-radius: 8px 8px 0 0;
  transform-origin: bottom;
  transform: scaleY(0);
}

.notification-icons {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.notification {
  width: 120px;
  height: 120px;
  background: rgba(34, 197, 94, 0.2);
  border: 2px solid #22C55E;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.5);
}

.notification svg {
  width: 60px;
  height: 60px;
  fill: #22C55E;
}

/* Cena 5 - CTA */
.cta-word {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 180px;
  font-weight: 700;
  color: #22C55E;
  text-align: center;
  margin-bottom: 60px;
  opacity: 0;
  transform: scale(0.8);
  position: relative;
  overflow: hidden;
}

.cta-word::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
  animation: shine 2s infinite;
}

@keyframes shine {
  0% { left: -100%; }
  100% { left: 100%; }
}

.cta-word.visible {
  opacity: 1;
  transform: scale(1);
}

.comment-bar {
  width: 800px;
  height: 80px;
  background: rgba(255,255,255,0.1);
  border: 2px solid #3B82F6;
  border-radius: 40px;
  display: flex;
  align-items: center;
  padding: 0 30px;
  opacity: 0;
  transform: translateY(30px);
}

.comment-bar.visible {
  opacity: 1;
  transform: translateY(0);
}

.comment-text {
  font-family: 'Inter', sans-serif;
  font-size: 40px;
  color: #F4F1EC;
  flex: 1;
}

.comment-cursor {
  width: 3px;
  height: 50px;
  background: #22C55E;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.know-more-button {
  margin-top: 40px;
  background: #22C55E;
  color: #0A0A0F;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 48px;
  font-weight: 700;
  padding: 30px 80px;
  border-radius: 16px;
  opacity: 0;
  transform: scale(0.8);
  box-shadow: 0 10px 40px rgba(34, 197, 94, 0.5);
}

.know-more-button.visible {
  opacity: 1;
  transform: scale(1);
}

/* Logo */
.logo {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  opacity: 0;
}

.logo.visible {
  opacity: 1;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Transições */
.transition-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0A0A0F;
  opacity: 0;
  pointer-events: none;
  z-index: 500;
}
</style>
</head>
<body class="paused">

<div id="stage-container">

    <div class="scene" id="scene-2">

      <div class="pain-visual">
        <div class="spreadsheet-icon" id="spreadsheet-1" style="left: 50px; top: 50px;">
          <svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="none" stroke="#F4F1EC" stroke-width="3"/><line x1="10" y1="30" x2="90" y2="30" stroke="#F4F1EC" stroke-width="2"/><line x1="10" y1="50" x2="90" y2="50" stroke="#F4F1EC" stroke-width="2"/><line x1="10" y1="70" x2="90" y2="70" stroke="#F4F1EC" stroke-width="2"/><line x1="35" y1="10" x2="35" y2="90" stroke="#F4F1EC" stroke-width="2"/><line x1="65" y1="10" x2="65" y2="90" stroke="#F4F1EC" stroke-width="2"/></svg>

          <img src="https://via.placeholder.com/800x1000/111/22C55E?text=Print+Real+da+Ferramenta+1" alt="Screenshot 1">
        </div>

<script>
// Configuração
const TOTAL_DURATION = 30;
const SCENES = [
  { start: 0, end: 4, text: "Atenção, Nutricionista! Estamos selecionando profissionais para testar uma nova ferramenta exclusiva.", highlights: ["Atenção", "exclusiva"] },
  { start: 4.5, end: 9, text: "Chega de perder horas montando planos alimentares em planilhas.", highlights: ["Chega", "horas"] },
  { start: 9.5, end: 16.5, text: "Conheça o NutriFlow. Automatize seus atendimentos e entregue tudo em minutos.", highlights: ["NutriFlow", "minutos"] },
  { start: 17, end: 23, text: "Ganhe tempo livre e tenha pacientes muito mais engajados.", highlights: ["tempo livre", "engajados"] },
  { start: 23.5, end: 30, text: "Vagas limitadas para o teste. Comente EU QUERO que te envio o acesso agora.", highlights: ["limitadas", "EU QUERO"] }
];

// Estado
let currentTime = 0;
let isPlaying = false;
let isCountingDown = false;
let countdownValue = 3;
let animationFrame = null;
let lastTimestamp = null;
let showDebug = false;

// Elementos
const stage = document.getElementById('stage');
const startScreen = document.getElementById('start-screen');
const countdownScreen = document.getElementById('countdown-screen');
const countdownNumber = document.getElementById('countdown-number');
const debugTimer = document.getElementById('debug-timer');
const transitionOverlay = document.getElementById('transition-overlay');
const logo = document.getElementById('logo');

// Escala do palco
function scaleStage() {
  const containerWidth = window.innerWidth;
  const containerHeight = window.innerHeight;
  const scaleX = containerWidth / 1080;
  const scaleY = containerHeight / 1920;
  const scale = Math.min(scaleX, scaleY);
  stage.style.transform = `scale(${scale})`;
}

scaleStage();
window.addEventListener('resize', scaleStage);

// Inicializar palavras
function initWords() {
  SCENES.forEach((scene, index) => {
    const container = document.getElementById(`words-${index + 1}`);
    const words = scene.text.split(' ');
    words.forEach(word => {
      const span = document.createElement('span');
      span.className = 'word';
      if (scene.highlights.some(h => word.includes(h))) {
        span.classList.add('highlight');
      }
      span.textContent = word;
      container.appendChild(span);
    });
  });
}

initWords();

// Ease out exponencial
function easeOutExpo(t) {
  return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
}

// Render função principal
function render(t) {
  // Atualizar debug
  if (showDebug) {
    debugTimer.textContent = t.toFixed(2) + 's';
  }

  // Movimento dos blobs
  const blob1 = document.querySelector('.blob-1');
  const blob2 = document.querySelector('.blob-2');
  const blob3 = document.querySelector('.blob-3');

  blob1.style.transform = `translate(${Math.sin(t * 0.3) * 50}px, ${Math.cos(t * 0.2) * 50}px)`;
  blob2.style.transform = `translate(${Math.cos(t * 0.25) * 60}px, ${Math.sin(t * 0.35) * 60}px)`;
  blob3.style.transform = `translate(-50%, -50%) translate(${Math.sin(t * 0.4) * 40}px, ${Math.cos(t * 0.3) * 40}px)`;

  // Zoom contínuo da câmera
  const zoomScale = 1 + (t / TOTAL_DURATION) * 0.05;
  stage.style.transform = `scale(${zoomScale * Math.min(window.innerWidth / 1080, window.innerHeight / 1920)})`;

  // Logo sempre visível após início
  if (t > 0) {
    logo.classList.add('visible');
  }

  // Determinar cena atual
  let currentScene = -1;
  for (let i = 0; i < SCENES.length; i++) {
    if (t >= SCENES[i].start && t < SCENES[i].end) {
      currentScene = i;
      break;
    }
  }

  // Atualizar cenas
  for (let i = 0; i < 5; i++) {
    const sceneEl = document.getElementById(`scene-${i + 1}`);
    if (i === currentScene) {
      sceneEl.classList.add('active');
      renderScene(i, t);
    } else {
      sceneEl.classList.remove('active');
    }
  }

  // Transições entre cenas
  for (let i = 0; i < SCENES.length - 1; i++) {
    const transitionStart = SCENES[i].end;
    const transitionEnd = SCENES[i + 1].start;
    if (t >= transitionStart && t < transitionEnd) {
      const progress = (t - transitionStart) / (transitionEnd - transitionStart);
      transitionOverlay.style.opacity = Math.sin(progress * Math.PI) * 0.8;
    }
  }
}

// Renderizar cena específica
function renderScene(sceneIndex, t) {
  const scene = SCENES[sceneIndex];
  const sceneDuration = scene.end - scene.start;
  const sceneProgress = (t - scene.start) / sceneDuration;

  // Animar palavras
  const wordsContainer = document.getElementById(`words-${sceneIndex + 1}`);
  const words = wordsContainer.querySelectorAll('.word');
  const wordDuration = sceneDuration / words.length;

  words.forEach((word, i) => {
    const wordStart = i * wordDuration;
    const wordProgress = Math.max(0, Math.min(1, (t - scene.start - wordStart) / 0.6));

    if (wordProgress > 0) {
      const eased = easeOutExpo(wordProgress);
      word.style.opacity = eased;
      word.style.transform = `translateY(${40 * (1 - eased)}px)`;
      word.style.filter = `blur(${10 * (1 - eased)}px)`;
    }
  });

  // Elementos visuais específicos por cena
  switch (sceneIndex) {
    case 0: // Cena 1 - Gancho
      const alertBadge = document.getElementById('alert-badge');
      const badgeProgress = Math.max(0, Math.min(1, sceneProgress * 3));
      const badgeEased = easeOutExpo(badgeProgress);
      alertBadge.style.opacity = badgeEased;
      alertBadge.style.transform = `scale(${0.8 + 0.2 * badgeEased})`;
      break;

    case 1: // Cena 2 - Dor
      const spreadsheet1 = document.getElementById('spreadsheet-1');
      const spreadsheet2 = document.getElementById('spreadsheet-2');
      const clockIcon = document.getElementById('clock-icon');

      const spreadProgress = Math.max(0, Math.min(1, sceneProgress * 2));
      const spreadEased = easeOutExpo(spreadProgress);

      spreadsheet1.style.opacity = spreadEased;
      spreadsheet1.style.transform = `translateY(${50 * (1 - spreadEased)}px) rotate(${-10 + 10 * spreadEased}deg)`;

      spreadsheet2.style.opacity = spreadEased;
      spreadsheet2.style.transform = `translateY(${50 * (1 - spreadEased)}px) rotate(${10 - 10 * spreadEased}deg)`;

      const clockProgress = Math.max(0, Math.min(1, (sceneProgress - 0.3) * 2));
      const clockEased = easeOutExpo(clockProgress);
      clockIcon.style.opacity = clockEased;
      clockIcon.style.transform = `translate(-50%, -50%) scale(${0.5 + 0.5 * clockEased}) rotate(${360 * sceneProgress}deg)`;
      break;

    case 2: // Cena 3 - Solução
      const screenshots = [
        document.getElementById('screenshot-1'),
        document.getElementById('screenshot-2'),
        document.getElementById('screenshot-3')
      ];

      screenshots.forEach((shot, i) => {
        const shotStart = i * 0.2;
        const shotProgress = Math.max(0, Math.min(1, (sceneProgress - shotStart) * 2));
        const shotEased = easeOutExpo(shotProgress);

        shot.style.opacity = shotEased;
        shot.style.transform = `translateY(${100 * (1 - shotEased)}px) rotateY(${-15 + 15 * shotEased}deg)`;
      });
      break;

    case 3: // Cena 4 - Benefício
      const chartContainer = document.getElementById('chart-container');
      const chartBars = chartContainer.querySelectorAll('.chart-bar');
      const notifications = [
        document.getElementById('notif-1'),
        document.getElementById('notif-2'),
        document.getElementById('notif-3')
      ];

      const chartProgress = Math.max(0, Math.min(1, sceneProgress * 2));
      const chartEased = easeOutExpo(chartProgress);
      chartContainer.style.opacity = chartEased;

      chartBars.forEach((bar, i) => {
        const barDelay = i * 0.1;
        const barProgress = Math.max(0, Math.min(1, (sceneProgress - barDelay) * 2));
        const barEased = easeOutExpo(barProgress);
        bar.style.transform = `scaleY(${barEased})`;
      });

      notifications.forEach((notif, i) => {
        const notifStart = 0.3 + i * 0.15;
        const notifProgress = Math.max(0, Math.min(1, (sceneProgress - notifStart) * 2));
        const notifEased = easeOutExpo(notifProgress);

        notif.style.opacity = notifEased;
        notif.style.transform = `scale(${0.5 + 0.5 * notifEased})`;
      });
      break;

    case 4: // Cena 5 - CTA
      const ctaWord = document.getElementById('cta-word');
      const commentBar = document.getElementById('comment-bar');
      const commentText = document.getElementById('comment-text');
      const knowMoreBtn = document.getElementById('know-more-btn');

      const ctaProgress = Math.max(0, Math.min(1, sceneProgress * 2));
      const ctaEased = easeOutExpo(ctaProgress);
      ctaWord.style.opacity = ctaEased;
      ctaWord.style.transform = `scale(${0.8 + 0.2 * ctaEased})`;

      const commentProgress = Math.max(0, Math.min(1, (sceneProgress - 0.2) * 2));
      const commentEased = easeOutExpo(commentProgress);
      commentBar.style.opacity = commentEased;
      commentBar.style.transform = `translateY(${30 * (1 - commentEased)}px)`;

      // Digitar texto
      const fullText = "EU QUERO";
      const charProgress = Math.max(0, Math.min(1, (sceneProgress - 0.3) * 2));
      const charsToShow = Math.floor(charProgress * fullText.length);
      commentText.textContent = fullText.substring(0, charsToShow);

      const btnProgress = Math.max(0, Math.min(1, (sceneProgress - 0.5) * 2));
      const btnEased = easeOutExpo(btnProgress);
      knowMoreBtn.style.opacity = btnEased;
      knowMoreBtn.style.transform = `scale(${0.8 + 0.2 * btnEased})`;
      break;
  }
}

// Loop de animação
function animate(timestamp) {
  if (!lastTimestamp) lastTimestamp = timestamp;
  const delta = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;

  if (isPlaying && !isCountingDown) {
    currentTime += delta;

    if (currentTime >= TOTAL_DURATION) {
      currentTime = TOTAL_DURATION;
      isPlaying = false;
      document.body.classList.add('paused');
    }

    render(currentTime);
  }

  animationFrame = requestAnimationFrame(animate);
}

// Contagem regressiva
function startCountdown() {
  isCountingDown = true;
  countdownValue = 3;
  startScreen.classList.add('hidden');
  countdownScreen.classList.remove('hidden');
  countdownNumber.textContent = countdownValue;

  const countInterval = setInterval(() => {
    countdownValue--;
    if (countdownValue > 0) {
      countdownNumber.textContent = countdownValue;
    } else {
      clearInterval(countInterval);
      countdownScreen.classList.add('hidden');
      isCountingDown = false;
      isPlaying = true;
      document.body.classList.remove('paused');
      lastTimestamp = null;
    }
  }, 1000);
}

// Controles
function togglePlay() {
  if (isCountingDown) return;

  if (!isPlaying && currentTime === 0) {
    startCountdown();
  } else {
    isPlaying = !isPlaying;
    document.body.classList.toggle('paused');
    if (isPlaying) {
      lastTimestamp = null;
    }
  }
}

function restart() {
  currentTime = 0;
  isPlaying = false;
  isCountingDown = false;
  document.body.classList.add('paused');
  startScreen.classList.remove('hidden');
  countdownScreen.classList.add('hidden');
  render(0);
}

function jumpScene(direction) {
  const currentSceneIndex = SCENES.findIndex(s => currentTime >= s.start && currentTime < s.end);
  let newIndex = currentSceneIndex + direction;

  if (newIndex < 0) newIndex = 0;
  if (newIndex >= SCENES.length) newIndex = SCENES.length - 1;

  currentTime = SCENES[newIndex].start;
  render(currentTime);
}

function toggleDebug() {
  showDebug = !showDebug;
  debugTimer.classList.toggle('visible');
}

// Event listeners
document.addEventListener('click', togglePlay);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'KeyR') {
    restart();
  } else if (e.code === 'ArrowLeft') {
    jumpScene(-1);
  } else if (e.code === 'ArrowRight') {
    jumpScene(1);
  } else if (e.code === 'KeyT') {
    toggleDebug();
  }
});

// Iniciar loop
animationFrame = requestAnimationFrame(animate);
render(0);
</script>
